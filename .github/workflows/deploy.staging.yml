name: Deploy staging (OIDC)

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

concurrency:
  group: staging-elorae
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SLUG: elorae
      OIDC_AUD: okejob.app
      DEPLOY_URL: https://okejob.app/api/staging/oidc-deploy
      STATUS_URL: https://okejob.app/api/staging/oidc-deployments
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - name: OIDC deploy
        shell: bash
        run: |
          set -euo pipefail
          mint() {
            curl -sS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUD}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          }
          JWT="$(mint)"
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${JWT}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "${DEPLOY_URL}" | tee /tmp/oidc-deploy.json
          echo
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open("/tmp/oidc-deploy.json"))
          expected = os.environ["EXPECTED_SHA"]
          got = d.get("ref") or d.get("token_sha") or ""
          if got != expected:
              print(f"deploy response ref {got!r} != EXPECTED_SHA {expected!r}", file=sys.stderr)
              sys.exit(1)
          print(f"deploy accepted ref={got}")
          PY

      - name: Poll status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          expected = os.environ["EXPECTED_SHA"]
          slug = os.environ["SLUG"]
          status_url = f"{os.environ['STATUS_URL'].rstrip('/')}/{slug}"
          aud = os.environ["OIDC_AUD"]
          id_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          id_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          def mint() -> str:
              req = urllib.request.Request(
                  f"{id_url}&audience={aud}",
                  headers={"Authorization": f"Bearer {id_token}"},
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)["value"]

          def fetch_status(jwt: str) -> tuple[int, dict | None, str]:
              req = urllib.request.Request(
                  status_url,
                  headers={"Authorization": f"Bearer {jwt}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode()
                      return resp.status, json.loads(body), body
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors="replace")
                  return e.code, None, body
              except Exception as e:  # noqa: BLE001 — soft-retry network blips
                  return 0, None, str(e)

          # ref updates at accept while build_status may briefly stay a prior
          # "ok". Accept ok only after we have seen a non-ok status for the
          # matched ref (usually "building"). Poll aggressively at first so a
          # fast building→ok flip is not missed.
          seen_non_ok = False
          soft_failures = 0
          deadline = time.time() + 30 * 60
          poll = 0
          while time.time() < deadline:
              poll += 1
              code, data, raw = fetch_status(mint())
              if code < 200 or code >= 300 or data is None:
                  soft_failures += 1
                  print(f"poll {poll} soft-fail HTTP {code}: {raw[:300]}")
                  if soft_failures >= 10:
                      print("too many consecutive status soft-failures", file=sys.stderr)
                      sys.exit(1)
                  time.sleep(5 if poll <= 24 else 20)
                  continue
              soft_failures = 0

              dep = data.get("deployment") or data
              ref = str(dep.get("ref") or "")
              status = str(dep.get("build_status") or "")
              matched = ref == expected
              print(f"poll {poll} ref={ref or '?'} build_status={status or 'pending'} match={int(matched)}")

              if not matched:
                  time.sleep(5 if poll <= 24 else 20)
                  continue

              if status not in ("ok",):
                  seen_non_ok = True

              if status in ("failed", "built-but-restart-failed"):
                  print(f"build failed: {status}", file=sys.stderr)
                  print(raw[:2000], file=sys.stderr)
                  sys.exit(1)

              if status == "ok" and seen_non_ok:
                  print(f"build ok for {expected}")
                  sys.exit(0)

              if status == "ok" and not seen_non_ok:
                  print("matching ref still on pre-build ok; waiting for non-ok progress")

              time.sleep(5 if poll <= 24 else 20)

          print(f"timed out waiting for build of {expected}", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Smoke-check staging URL
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local url="$1"
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$url" || true)
            echo "$url -> $code"
            [[ "$code" =~ ^(200|301|302|307|308)$ ]] || return 1
          }
          for i in $(seq 1 12); do
            if check https://elorae.okejob.app/; then
              exit 0
            fi
            echo "smoke retry $i"
            sleep 10
          done
          echo "smoke check failed"
          exit 1
