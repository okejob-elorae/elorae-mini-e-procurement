name: CI

on:
  pull_request:
    branches: [master]
  push:
    # timotiusmax: SEMENTARA — cabang gabungan versi Max diuji di sini sebelum PR ke master.
    # Hapus entri ini sebelum cabang itu di-merge.
    branches: [master, timotiusmax]
    # Docs-only pushes go straight to master and change nothing these jobs check.
    # The pull_request trigger is deliberately unfiltered: a required check that never
    # reports blocks a merge forever.
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A new push to a PR supersedes its running checks. A push to master gets a group of its
# own (the run id), so no master commit is ever cancelled or replaced while pending.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# This workflow does not gate deploy.yml, and nothing here makes a check required.
# Branch protection is a repository setting, chosen only after the suite has gone green
# on a runner: a flaky spec must not be able to block a production deploy.

jobs:
  checks:
    name: Type-check, lint, api unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 8 GB: `tsc --noEmit` on apps/web aborted (exit 134, heap limit) at 4 GB once the Max
      # features landed. GitHub-hosted runners have 16 GB.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No dependency cache: the repo's 10 GB Actions cache is already saturated by
          # the deploy's Docker layer caches, and another entry only speeds their eviction.
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.1.3 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client and build @elorae/db
        id: db
        run: pnpm --filter @elorae/db generate
      - name: Type-check api
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: pnpm -F @elorae/api type-check
      - name: Type-check web
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        # next-env.d.ts is generated by next dev/build and is not committed.
        # The tsc problem matcher reads paths relative to apps/web as repo-root paths, so its
        # annotations land on ".github" with no file, and only 10 per step are kept. Bundle every
        # error into a few annotations instead, so the full list is readable from the run page.
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > apps/web/next-env.d.ts
          set +e
          pnpm -F @elorae/web exec tsc --noEmit --pretty false > /tmp/tsc-web.txt 2>&1
          code=$?
          set -e
          echo "tsc apps/web: $(grep -c "error TS" /tmp/tsc-web.txt || true) error(s)"
          grep "error TS" /tmp/tsc-web.txt | sed "s#^#apps/web/#" | split -l 80 - /tmp/tsc-part- || true
          for f in /tmp/tsc-part-*; do
            [ -f "$f" ] || continue
            echo "::error title=tsc apps/web ($(basename "$f"))::$(sed -e "s/%/%25/g" -e "s/\r/%0D/g" "$f" | awk '{printf "%s%%0A", $0}')"
          done
          exit $code
      # apps/api has no lint step: its `lint` script runs ESLint 9 with no flat config in
      # the package, which exits non-zero on every run. Add a config before adding the step.
      - name: Lint web
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: pnpm -F @elorae/web lint
      - name: Test api
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        # exec, not `test -- --maxWorkers=2`: a `--` forwarded to jest turns the flag into
        # a test path pattern that matches nothing.
        run: pnpm -F @elorae/api exec jest --maxWorkers=2

  # SEMENTARA (cabang timotiusmax): the web image build, exactly as apps/web/Dockerfile runs it,
  # so the merge proves `next build` passes before it reaches the deploy. Remove with the trigger.
  build-web:
    name: Build web (as the deploy image does)
    if: github.ref == 'refs/heads/timotiusmax'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.1.3 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (db generate, db build, web build)
        run: |
          pnpm --filter @elorae/db generate
          pnpm --filter @elorae/db build
          pnpm --filter @elorae/web build

  db-specs:
    name: DB specs on a fresh MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: elorae
          MARIADB_DATABASE: elorae
          MARIADB_USER: elorae
          MARIADB_PASSWORD: elorae
        ports: ["3308:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      # Same host/port/credentials as the local :3308 test bed, so every spec's isProd
      # guard reads it as a test bed. This database exists only for this job.
      DATABASE_URL: mysql://elorae:elorae@127.0.0.1:3308/elorae
      REDIS_URL: redis://127.0.0.1:6379
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.1.3 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client and build @elorae/db
        run: pnpm --filter @elorae/db generate
      - name: Apply migrations through the deploy's mariadb client
        # Mirrors deploy.yml's migrate job: the mariadb CLI connects as utf8mb3, which is
        # what rejects a COLLATE utf8mb4_* on a bare string literal. Prisma's migrate
        # deploy connects as utf8mb4 and would let that migration through to prod.
        run: |
          set -euo pipefail
          for dir in $(ls -d packages/db/prisma/migrations/*/ | sort); do
            echo ">>> Applying $(basename "$dir")"
            docker exec -i "${{ job.services.db.id }}" sh -c 'mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" --skip-ssl "$MARIADB_DATABASE"' < "${dir}migration.sql"
          done
      - name: Seed
        id: seed
        run: pnpm -F @elorae/db seed
      - name: packages/db specs
        # The db vitest config leaves file parallelism on, and its specs share one
        # database: parallel files collide on fixtures and trip hook timeouts.
        run: pnpm -F @elorae/db exec vitest run --no-file-parallelism
      - name: apps/web specs
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: pnpm -F @elorae/web exec vitest run --reporter=default --reporter=json --outputFile=/tmp/vitest-web.json
      # GitHub keeps only 10 error annotations per step, so a long failure list surfaced ten at a
      # time. Bundle every failing test (one line each) into a few notices instead.
      - name: List every failing web spec
        if: ${{ !cancelled() && steps.seed.outcome == 'success' }}
        run: |
          [ -f /tmp/vitest-web.json ] || exit 0
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/vitest-web.json", "utf8"));
            const gagal = [];
            for (const f of r.testResults || []) {
              const berkas = (f.name || "").split("/apps/web/").pop();
              if (f.status === "failed" && !(f.assertionResults || []).some((t) => t.status === "failed"))
                gagal.push(berkas + " :: (file) " + String(f.message || "").split("\n")[0].slice(0, 200));
              for (const t of f.assertionResults || [])
                if (t.status === "failed") gagal.push(berkas + " :: " + t.fullName + " :: " + String((t.failureMessages || [""])[0]).split("\n")[0].slice(0, 200));
            }
            console.log("failing web specs: " + gagal.length);
            const esc = (x) => x.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            for (let i = 0; i < gagal.length; i += 12) console.log("::notice title=failing web specs " + (i + 1) + "-" + Math.min(i + 12, gagal.length) + "::" + esc(gagal.slice(i, i + 12).join("\n")));
          '
