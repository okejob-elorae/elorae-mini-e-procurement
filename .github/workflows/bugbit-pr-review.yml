name: PR Review (bugbit)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - master
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: number

concurrency:
  group: bugbit-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write   # needed for auto-describe label inference

jobs:
  bugbit_review:
    # Skip bots, drafts, and fork PRs (forks cannot access CURSOR_API_KEY secrets)
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.sender.type != 'Bot'
              && github.event.pull_request.draft == false
              && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          persist-credentials: false

      - name: Run bugbit review + describe
        # JuicyBurger/bugbit v1.4.2
        uses: JuicyBurger/bugbit@c26a85aa3c4ecf2d0b34356507ebeec14e5980d1
        with:
          cursor-api-key: ${{ secrets.CURSOR_API_KEY }}
          github-token: ${{ github.token }}
          model: auto
          review-modes: code-review
          auto-describe: true
          post-clean-summary: true
          pr-number: ${{ steps.pr.outputs.number }}
