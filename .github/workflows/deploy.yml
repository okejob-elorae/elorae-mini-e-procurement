name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      service:
        description: "Which service to deploy"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - web
          - api
      image_tag:
        description: "Image tag to deploy (SHA or 'master'). Blank = this run's commit SHA."
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/db/**'
              - 'pnpm-lock.yaml'
              - 'docker-compose.prod.yml'
              - 'Caddyfile'
            api:
              - 'apps/api/**'
              - 'packages/db/**'
              - 'pnpm-lock.yaml'
              - 'docker-compose.prod.yml'
              - 'Caddyfile'

  build-push-web:
    name: Build + push web image
    needs: changes
    if: |
      (github.event_name == 'push' && needs.changes.outputs.web == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'web'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/okejob-elorae/elorae-web:${{ github.sha }}
            ghcr.io/okejob-elorae/elorae-web:master
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=min,scope=web
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}

  build-push-api:
    name: Build + push api image
    needs: changes
    if: |
      (github.event_name == 'push' && needs.changes.outputs.api == 'true') ||
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'api'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/okejob-elorae/elorae-api:${{ github.sha }}
            ghcr.io/okejob-elorae/elorae-api:master
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=min,scope=api

  pull:
    name: Pull latest master on VPS
    needs: changes
    if: |
      (github.event_name == 'push' && (needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true')) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and pull
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 2m
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /srv/elorae
            git fetch origin master
            git reset --hard origin/master

  migrate:
    name: Migrate database
    needs: [pull, build-push-web, build-push-api]
    # The image builds are where `next build` and `tsc` type-check. They used to be SIBLINGS of
    # this job (both only needed `changes`), so they raced it — and a migration takes seconds
    # while an image build takes minutes. A web type error therefore let the schema advance and
    # then failed the build, leaving prod serving the old image against the new schema with no
    # rollback. That happened on PR #229 (deploy 31293514640). Gating here means the schema
    # cannot move unless the image that must run against it actually compiles.
    #
    # always() is required because build-push-web/api are `if:`-gated and are legitimately
    # SKIPPED on a single-service change; without it, an api-only push would cascade-skip this
    # job and deploy nothing. The explicit checks then encode what we actually mean: pull must
    # have succeeded, and neither image build may have FAILED — skipped is fine, failed is not.
    if: |
      always() &&
      !cancelled() &&
      needs.pull.result == 'success' &&
      needs.build-push-web.result != 'failure' &&
      needs.build-push-web.result != 'cancelled' &&
      needs.build-push-api.result != 'failure' &&
      needs.build-push-api.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and apply migrations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 2m
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /srv/elorae

            # Apply pending Prisma migrations via mariadb client (skip prisma migrate engine —
            # it refuses to connect to the --skip-ssl MariaDB regardless of URL params).
            # Idempotent: reads applied names from _prisma_migrations, applies + records the diff.
            DB_ROOT_PASSWORD=$(grep ^DB_ROOT_PASSWORD= .env | cut -d= -f2)
            docker exec -i elorae-db mariadb -uroot -p"${DB_ROOT_PASSWORD}" --skip-ssl elorae <<'SQL'
            CREATE TABLE IF NOT EXISTS _prisma_migrations (
              id varchar(36) NOT NULL PRIMARY KEY,
              checksum varchar(64) NOT NULL,
              finished_at datetime(3) DEFAULT NULL,
              migration_name varchar(255) NOT NULL,
              logs text,
              rolled_back_at datetime(3) DEFAULT NULL,
              started_at datetime(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
              applied_steps_count int UNSIGNED NOT NULL DEFAULT 0
            );
            SQL
            APPLIED=$(docker exec elorae-db mariadb -uroot -p"${DB_ROOT_PASSWORD}" --skip-ssl -N -B -e "SELECT migration_name FROM elorae._prisma_migrations")
            cd packages/db/prisma/migrations
            for m in $(ls -d */ | sort); do
              NAME=$(basename "$m")
              if ! grep -qx "$NAME" <<< "$APPLIED"; then
                echo ">>> Applying $NAME"
                docker exec -i elorae-db mariadb -uroot -p"${DB_ROOT_PASSWORD}" --skip-ssl elorae < "${m}migration.sql"
                CHECKSUM=$(sha256sum "${m}migration.sql" | cut -d' ' -f1)
                UUID=$(cat /proc/sys/kernel/random/uuid)
                docker exec -i elorae-db mariadb -uroot -p"${DB_ROOT_PASSWORD}" --skip-ssl elorae -e "INSERT INTO _prisma_migrations (id, checksum, finished_at, migration_name, started_at, applied_steps_count) VALUES ('$UUID', '$CHECKSUM', NOW(3), '$NAME', NOW(3), 1);"
              fi
            done

  deploy-api:
    name: Deploy api
    needs: [changes, build-push-api, migrate]
    # always() is REQUIRED here, and the comment that used to argue the opposite was
    # wrong. "All needs succeeded" is not the rule GitHub applies: a SKIP propagates
    # transitively down the needs graph, and `migrate` needs `build-push-web`. So on
    # an api-only push, build-push-web is legitimately skipped -> the skip travels
    # through migrate (which itself ran, via its own always()) -> deploy-api is
    # skipped even though all three of ITS needs succeeded. Measured 2026-09-02:
    # runs 33617613828 (#277) and 33634525717 (#280) both built and pushed an api
    # image and then silently deployed nothing, leaving prod on the previous image
    # while the overall run still read green. deploy-web already carried this exact
    # fix. The explicit result checks below are what keep a genuinely failed build
    # or migration blocking the deploy.
    #
    # !cancelled() is not decoration: always() evaluates true even on a CANCELLED
    # run, and cancelling is the only abort button here (concurrency uses
    # cancel-in-progress: false, so nothing else ever cancels a run). Without it,
    # hitting Cancel while this job is queued would still ship the image.
    if: |
      always() &&
      !cancelled() &&
      needs.migrate.result == 'success' &&
      needs.build-push-api.result == 'success' &&
      (
        (github.event_name == 'push' && needs.changes.outputs.api == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'api'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: SSH pull + restart api
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          timeout: 2m
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /srv/elorae
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180 api
            # Assert the deployed image is the one we asked for. `up -d` is a no-op
            # when compose resolves the image it already has, so a deploy that changed
            # nothing otherwise exits 0 — the same silent-success class as the
            # skipped-job bug above. Three details are load-bearing:
            #  - resolve the container via `compose ps -q`, not by container_name:
            #    docker-compose.prod.yml sits in BOTH path filters, so a rename would
            #    make `docker inspect <name>` hit an orphan or abort under pipefail,
            #    failing this deploy and (via deploy-web's needs) stranding a migration
            #    in front of a stale web image — the PR #229 shape.
            #  - compare resolved image IDs, not a substring: IMAGE_TAG is documented
            #    to accept "master", which any :master reference trivially contains,
            #    so substring matching cannot tell an old :master from a new one.
            #  - --wait above blocks on the healthcheck; the image tag alone is true of
            #    a container that is crash-looping on the new build.
            CID=$(docker compose -f docker-compose.prod.yml ps -q api)
            if [ -z "$CID" ]; then
              echo "DEPLOY VERIFY FAILED: no api container after up -d" >&2; exit 1
            fi
            WANT=$(docker image inspect --format '{{.Id}}' "ghcr.io/okejob-elorae/elorae-api:$IMAGE_TAG")
            GOT=$(docker inspect --format '{{.Image}}' "$CID")
            if [ "$WANT" != "$GOT" ]; then
              echo "DEPLOY VERIFY FAILED: api wanted $IMAGE_TAG ($WANT) but container runs $GOT" >&2; exit 1
            fi
            echo "OK: elorae-api runs $IMAGE_TAG ($GOT)"
            # -a is required: pulled images are sha-TAGGED, never dangling, so a bare
            # `prune -f` never reclaims them (that no-op filled the 96G disk 2026-08-04).
            # until=336h keeps 14 days of tags as local rollback targets; in-use images
            # are always skipped regardless of age (mariadb/redis/caddy stay put).
            docker image prune -a --filter "until=336h" -f

  deploy-web:
    name: Deploy web
    needs: [changes, build-push-web, migrate, deploy-api]
    # Sequential after api. always() lets it evaluate when deploy-api is skipped
    # (api unchanged); still requires migrate + build-push-web success and web changed.
    if: |
      always() &&
      !cancelled() &&
      needs.migrate.result == 'success' &&
      needs.build-push-web.result == 'success' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (
        (github.event_name == 'push' && needs.changes.outputs.web == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.service == 'both' || inputs.service == 'web'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: SSH pull + restart web
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: IMAGE_TAG
          timeout: 2m
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /srv/elorae
            docker compose -f docker-compose.prod.yml pull web
            docker compose -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180 web
            # Assert the deployed image is the one we asked for. `up -d` is a no-op
            # when compose resolves the image it already has, so a deploy that changed
            # nothing otherwise exits 0 — the same silent-success class as the
            # skipped-job bug above. Three details are load-bearing:
            #  - resolve the container via `compose ps -q`, not by container_name:
            #    docker-compose.prod.yml sits in BOTH path filters, so a rename would
            #    make `docker inspect <name>` hit an orphan or abort under pipefail,
            #    failing this deploy and (via deploy-web's needs) stranding a migration
            #    in front of a stale web image — the PR #229 shape.
            #  - compare resolved image IDs, not a substring: IMAGE_TAG is documented
            #    to accept "master", which any :master reference trivially contains,
            #    so substring matching cannot tell an old :master from a new one.
            #  - --wait above blocks on the healthcheck; the image tag alone is true of
            #    a container that is crash-looping on the new build.
            CID=$(docker compose -f docker-compose.prod.yml ps -q web)
            if [ -z "$CID" ]; then
              echo "DEPLOY VERIFY FAILED: no web container after up -d" >&2; exit 1
            fi
            WANT=$(docker image inspect --format '{{.Id}}' "ghcr.io/okejob-elorae/elorae-web:$IMAGE_TAG")
            GOT=$(docker inspect --format '{{.Image}}' "$CID")
            if [ "$WANT" != "$GOT" ]; then
              echo "DEPLOY VERIFY FAILED: web wanted $IMAGE_TAG ($WANT) but container runs $GOT" >&2; exit 1
            fi
            echo "OK: elorae-web runs $IMAGE_TAG ($GOT)"
            # See deploy-api: -a is required (sha-tagged images are never dangling).
            docker image prune -a --filter "until=336h" -f
