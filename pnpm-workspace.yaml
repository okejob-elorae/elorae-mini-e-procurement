packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@firebase/util": false
  "@nestjs/core": true
  "@parcel/watcher": true
  "@prisma/engines": true
  "@scarf/scarf": false
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  msw: false
  prisma: true
  protobufjs: false
  sharp: true
  # Skrip pasangnya cuma `opencollective-postinstall` — spanduk donasi.
  # Model bahasanya dibundel di apps/web/tessdata, bukan diunduh.
  tesseract.js: false
  unrs-resolver: true
